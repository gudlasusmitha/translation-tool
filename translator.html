<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Language Translation Tool</title>
<style>
  body { font-family: Arial, sans-serif; background: #f3f5f9; margin: 0; }
  main { max-width: 720px; margin: 30px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid #d5dae3; border-radius: 10px; padding: 20px; }
  .row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; margin-bottom: 12px; }
  label { display: flex; flex-direction: column; font-size: 14px; color: #555; flex: 1; min-width: 130px; }
  select, textarea { font-size: 16px; padding: 9px; border: 1px solid #ccc; border-radius: 6px; }
  textarea { width: 100%; height: 120px; box-sizing: border-box; }
  button { font-size: 15px; padding: 9px 14px; border: 1px solid #bbb; background: #fff; border-radius: 6px; cursor: pointer; }
  button.primary { background: #1f5fbf; color: #fff; border-color: #1f5fbf; }
  .actions { margin: 12px 0; display: flex; gap: 8px; flex-wrap: wrap; }
  #output { min-height: 100px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; background: #fafbfd; font-size: 18px; white-space: pre-wrap; }
  .error { color: #b00020; }
</style>
</head>
<body>
<main>
  <h1>Language Translation Tool</h1>
  <div class="card">
    <div class="row">
      <label>From <select id="source"></select></label>
      <button id="swapBtn" title="Swap languages">&#8644;</button>
      <label>To <select id="target"></select></label>
    </div>

    <textarea id="inputText" maxlength="500" placeholder="Enter text to translate..."></textarea>

    <div class="actions">
      <button class="primary" id="translateBtn">Translate</button>
      <button id="copyBtn">Copy</button>
      <button id="speakBtn">Listen</button>
      <button id="clearBtn">Clear</button>
    </div>

    <div id="output">Translation will appear here.</div>
  </div>
</main>

<script>
  // Optional: paste a Google Cloud Translation API key here. Leave empty to use free APIs.
  const GOOGLE_API_KEY = "";

  const LANGUAGES = {
    en: "English", hi: "Hindi", te: "Telugu", ta: "Tamil", kn: "Kannada", ml: "Malayalam",
    fr: "French", de: "German", es: "Spanish", ar: "Arabic", ja: "Japanese", ko: "Korean"
  };

  const $ = (id) => document.getElementById(id);
  const sourceEl = $("source"), targetEl = $("target"), inputEl = $("inputText"), outEl = $("output");

  for (const [code, name] of Object.entries(LANGUAGES)) {
    sourceEl.add(new Option(name, code));
    targetEl.add(new Option(name, code));
  }
  sourceEl.value = "en";
  targetEl.value = "te";

  function show(text, isError) {
    outEl.textContent = text;
    outEl.className = isError ? "error" : "";
  }

  // API 1: Google Cloud Translation API (needs a key)
  async function translateWithGoogle(text, src, tgt) {
    const url = "https://translation.googleapis.com/language/translate/v2?key=" + GOOGLE_API_KEY;
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ q: text, source: src, target: tgt, format: "text" })
    });
    const data = await res.json();
    if (!res.ok) throw new Error("Google API error");
    return data.data.translations[0].translatedText;
  }

  // API 2: MyMemory (free, no key)
  async function translateWithMyMemory(text, src, tgt) {
    const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) +
                "&langpair=" + src + "|" + tgt;
    const res = await fetch(url);
    const data = await res.json();
    if (data.responseStatus !== 200) throw new Error("MyMemory error");
    return data.responseData.translatedText;
  }

  // API 3: Google Translate web endpoint (free, no key)
  async function translateWithGoogleFree(text, src, tgt) {
    const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" + src +
                "&tl=" + tgt + "&dt=t&q=" + encodeURIComponent(text);
    const res = await fetch(url);
    if (!res.ok) throw new Error("Google free endpoint error");
    const data = await res.json();
    return data[0].map((part) => part[0]).join("");
  }

  async function translateText() {
    const text = inputEl.value.trim();
    const src = sourceEl.value, tgt = targetEl.value;

    if (!text) return show("Please enter some text.", true);
    if (src === tgt) return show("Choose two different languages.", true);

    show("Translating...");
    $("translateBtn").disabled = true;

    const apis = [];
    if (GOOGLE_API_KEY) apis.push(translateWithGoogle);
    apis.push(translateWithMyMemory, translateWithGoogleFree);

    let result = null;
    for (const api of apis) {
      try { result = await api(text, src, tgt); break; }
      catch (err) { console.log(api.name + " failed:", err.message); }
    }

    if (result) show(result);
    else show("Could not reach any translation service. Try a different network.", true);
    $("translateBtn").disabled = false;
  }

  async function copyText() {
    try {
      await navigator.clipboard.writeText(outEl.textContent);
      $("copyBtn").textContent = "Copied";
    } catch (e) {
      $("copyBtn").textContent = "Copy failed";
    }
    setTimeout(() => ($("copyBtn").textContent = "Copy"), 1500);
  }

  function speakText() {
    if (!("speechSynthesis" in window)) return alert("Text-to-speech is not supported here.");
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(outEl.textContent);
    u.lang = targetEl.value;
    speechSynthesis.speak(u);
  }

  function swapLanguages() {
    const s = sourceEl.value;
    sourceEl.value = targetEl.value;
    targetEl.value = s;
  }

  function clearAll() {
    inputEl.value = "";
    show("Translation will appear here.");
  }

  $("translateBtn").addEventListener("click", translateText);
  $("copyBtn").addEventListener("click", copyText);
  $("speakBtn").addEventListener("click", speakText);
  $("swapBtn").addEventListener("click", swapLanguages);
  $("clearBtn").addEventListener("click", clearAll);
</script>
</body>
</html>
